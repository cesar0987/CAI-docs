# CI — Repositorio de documentación del proyecto CAI
# Ver: sistema cai/05 - Proceso de Desarrollo/05.08 §6 (T4) y 05.09 §10
# Todos los checks son bloqueantes. Un PR que falle no se mergea.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Bóveda y herramientas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar la bóveda
        run: python3 bin/validate-vault.py

      - name: Pruebas de las herramientas
        run: python3 -m unittest discover -s bin/tests -v

      - name: Tipos de las herramientas
        run: |
          python3 -m pip install --disable-pip-version-check "mypy>=1.8,<2"
          python3 -m mypy bin/cai-log.py bin/validate-vault.py
