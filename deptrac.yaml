# deptrac.yaml — Fronteras entre módulos del proyecto CAI
# Ver: sistema cai/02 - Arquitectura/02.03 Reglas de Frontera entre Módulos.md
# Ver: sistema cai/05 - Proceso de Desarrollo/05.07 Gobierno del Cambio.md (GE-01)
#
# Las reglas se verifican con: composer deptrac
# En CI: bloqueante

deptrac:
  paths:
    - ./packages
    - ./app
  exclude_files:
    - .*\/vendor\/.*
    - .*\/tests\/.*
    - .*\/database\/factories\/.*
    - .*\/database\/seeders\/.*

  layers:
    - name: Core
      collectors:
        - type: directory
          value: packages/core/.*

    - name: Identity
      collectors:
        - type: directory
          value: packages/identity/.*

    - name: Students
      collectors:
        - type: directory
          value: packages/students/.*

    - name: Scheduling
      collectors:
        - type: directory
          value: packages/scheduling/.*

    - name: Care
      collectors:
        - type: directory
          value: packages/care/.*

    - name: Billing
      collectors:
        - type: directory
          value: packages/billing/.*

    - name: Documents
      collectors:
        - type: directory
          value: packages/documents/.*

    - name: Notifications
      collectors:
        - type: directory
          value: packages/notifications/.*

    - name: Reporting
      collectors:
        - type: directory
          value: packages/reporting/.*

    - name: AppHost
      collectors:
        - type: directory
          value: app/.*

  ruleset:
    Core: []
    Identity: [Core]
    Students: [Core, Identity]
    Scheduling: [Core, Students, Identity]
    Care: [Core, Students, Scheduling, Identity]
    Billing: [Core, Students, Scheduling, Identity]
    Documents: [Core, Students, Identity]
    Notifications: [Core, Identity]
    Reporting: [Core, Identity, Students, Scheduling, Care, Billing, Documents]
    AppHost: [Core, Identity, Students, Scheduling, Care, Billing, Documents, Notifications, Reporting]

  formatters:
    graphviz:
      hidden_layers: []
      groups: []
    table:
      groups: ["Core", "Identity", "Students", "Scheduling", "Care", "Billing", "Documents", "Notifications", "Reporting", "AppHost"]
